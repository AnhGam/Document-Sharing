name: CI/CD Pipeline

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_FILE: document-sharing-manager.sln
  BUILD_CONFIGURATION: Release
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-and-lint:
    name: Security and Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanner (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build and Advanced Testing
    needs: security-and-lint
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      installer_size: ${{ steps.capacity.outputs.installer_size }}
      repo_size: ${{ steps.capacity.outputs.repo_size }}
      build_duration: ${{ steps.capacity.outputs.build_duration }}
    steps:
      - name: Record Start Time
        id: start_time
        shell: pwsh
        run: |
          $ts = [DateTimeOffset]::Now.ToUnixTimeSeconds()
          echo "ts=$ts" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Dynamic Semantic Versioning
        id: version
        run: |
          powershell ./scripts/prepare-release.ps1 -BuildNumber "${{ github.run_number }}"
        shell: pwsh

      - name: Setup Environment
        uses: microsoft/setup-msbuild@v2
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore and Optimize Assets
        run: |
          nuget restore ${{ env.SOLUTION_FILE }}
          dotnet restore document-sharing-manager.Tests/document-sharing-manager.Tests.csproj
          powershell ./scripts/optimize-assets.ps1

      - name: Dependency Audit and Groq AI
        shell: pwsh
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          dotnet list document-sharing-manager.Tests/document-sharing-manager.Tests.csproj package --vulnerable > audit_log.txt || true
          ./scripts/security-auditor-groq.ps1 -AuditLog audit_log.txt

      - name: Build Solution (Zero Warning Policy)
        run: msbuild ${{ env.SOLUTION_FILE }} /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform="Any CPU" /t:Rebuild /p:TreatWarningsAsErrors=true

      - name: Run Advanced Tests (NUnit)
        run: |
          dotnet test document-sharing-manager.Tests/document-sharing-manager.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --logger "trx;LogFileName=test_results.trx"

      - name: Download .NET 4.8 Redistributable for Installer
        run: |
          if (-not (Test-Path "redist")) { New-Item -ItemType Directory -Path "redist" -Force }
          if (-not (Test-Path "redist/ndp48-web.exe")) {
              Write-Host "Downloading .NET 4.8 Web Installer..."
              Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?LinkId=2085155" -OutFile "redist/ndp48-web.exe"
              Write-Host "Download complete."
          }
        shell: pwsh

      - name: Build Installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
          powershell -Command "if (Test-Path 'installer/DocumentSharingManager_v${{ steps.version.outputs.version }}_Setup.exe') { Write-Host 'Installer Success' } else { exit 1 }"

      - name: Run Silent Installer Smoke Testing
        run: |
          powershell ./scripts/smoke-test-installer.ps1 -Version "${{ steps.version.outputs.version }}"
        shell: pwsh

      - name: Run Capacity Check & DORA Analytics
        id: capacity
        shell: pwsh
        run: |
          $startTime = [long]${{ steps.start_time.outputs.ts }}
          $now = [DateTimeOffset]::Now.ToUnixTimeSeconds()
          $durationSeconds = [int]($now - $startTime)
          if ($durationSeconds -lt 0) { $durationSeconds = 0 }
          
          ./scripts/capacity-governance.ps1 -MaxInstallerSizeMB 50 -MaxRepoSizeMB 500 -BuildDurationSeconds $durationSeconds

      - name: Publish Capacity Report
        if: always()
        run: |
          if (Test-Path capacity_report.md) {
              cat capacity_report.md >> $env:GITHUB_STEP_SUMMARY
          }
        shell: pwsh

      - name: Generate CHANGELOG.md
        run: |
          powershell ./scripts/generate-changelog.ps1 -Version "${{ steps.version.outputs.version }}"
        shell: pwsh

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          files: installer/DocumentSharingManager_v${{ steps.version.outputs.version }}_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: AI Build Log Analysis (Groq)
        if: always()
        shell: pwsh
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_BUILD_STATUS: ${{ job.status }}
          AI_COMMIT_SHA: ${{ github.sha }}
          AI_BRANCH: ${{ github.head_ref || github.ref_name }}
          AI_COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'No commit message' }}
        run: |
          ./scripts/ai-log-analyzer-groq.ps1 `
            -ApiKey "$env:GROQ_API_KEY" `
            -BuildStatus "$env:AI_BUILD_STATUS" `
            -CommitSha "$env:AI_COMMIT_SHA" `
            -Branch "$env:AI_BRANCH" `
            -CommitMessage "$env:AI_COMMIT_MESSAGE"


      - name: Archive Build Reports (GitOps)
        if: always() && github.event_name == 'push'
        shell: pwsh
        env:
          REPO_URL: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          BUILD_STATUS: ${{ job.status }}
          INSTALLER_SIZE: ${{ steps.capacity.outputs.installer_size || '0.0' }}
          REPO_SIZE: ${{ steps.capacity.outputs.repo_size || '0.0' }}
          BUILD_DURATION: ${{ steps.capacity.outputs.build_duration || '0.0' }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          ./scripts/publish-reports.ps1 `
            -RepoUrl "$env:REPO_URL" `
            -CommitSha "$env:COMMIT_SHA" `
            -RunId "$env:RUN_ID" `
            -BuildStatus "$env:BUILD_STATUS" `
            -InstallerSize "$env:INSTALLER_SIZE" `
            -RepoSize "$env:REPO_SIZE" `
            -BuildDuration "$env:BUILD_DURATION" `
            -Branch "$env:BRANCH_NAME" `
            -Actor "$env:ACTOR" `
            -CommitMessage "$env:COMMIT_MESSAGE"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: document-sharing-manager-v${{ github.run_number }}
          path: |
            installer/*.exe
            document-sharing-manager.Tests/StrykerOutput/
            *.md
          retention-days: 7

  deploy:
    name: Continuous Deployment (Self-Hosted Runner)
    needs: build-and-test
    runs-on: self-hosted
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Local Server Container and Measure Duration
        shell: powershell
        env:
          REPO_URL: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          RUN_ID: ${{ github.run_id }}
        run: |
          Write-Host "Starting deployment..."
          $startTime = [DateTimeOffset]::Now.ToUnixTimeSeconds()
          
          # Copy .env file from active workspace to runner directory
          if (Test-Path "c:\Users\Admin\source\repos\Document-Sharing\.env") {
              Copy-Item "c:\Users\Admin\source\repos\Document-Sharing\.env" -Destination "." -Force
              Write-Host "Successfully copied .env file from active workspace."
          } else {
              Write-Host "WARNING: .env file not found in active workspace!"
          }
          
          # Deploy containers
          docker compose down
          docker compose up -d --build
          
          $endTime = [DateTimeOffset]::Now.ToUnixTimeSeconds()
          $durationSeconds = $endTime - $startTime
          $durationMinutes = [Math]::Round($durationSeconds / 60, 2)
          if ($durationMinutes -lt 0.01) { $durationMinutes = 0.01 }
          Write-Host "Deployment completed in $durationMinutes minutes ($durationSeconds seconds)."
          
          # Publish deploy duration
          powershell ./scripts/publish-deploy-duration.ps1 `
            -RepoUrl "$env:REPO_URL" `
            -RunId "$env:RUN_ID" `
            -DeployDuration $durationMinutes



  notify:
    name: Discord Notification
    needs: [build-and-test, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Discord Webhook 2.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          INSTALLER_SIZE: ${{ needs.build-and-test.outputs.installer_size }}
          REPO_SIZE: ${{ needs.build-and-test.outputs.repo_size }}
          BUILD_DURATION: ${{ needs.build-and-test.outputs.build_duration }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            COLOR=3066993
            if [ "$BUILD_RESULT" != "success" ]; then COLOR=15158332; fi
            
            # Use safe fallback metrics
            D_INSTALLER="${INSTALLER_SIZE:-N/A}"
            D_REPO="${REPO_SIZE:-N/A}"
            D_DURATION="${BUILD_DURATION:-N/A}"
            
            MSG="**Project:** Document Sharing Manager\n**Author:** $ACTOR\n**Commit:** $COMMIT_SHA\n\n"
            MSG="$MSG**[DORA & Capacity Metrics]**\n"
            MSG="$MSG- **Lead Time (CI):** $D_DURATION min\n"
            MSG="$MSG- **Installer Size:** $D_INSTALLER MB\n"
            MSG="$MSG- **Repo Size:** $D_REPO MB\n"
            MSG="$MSG- **Status:** $BUILD_RESULT\n\n"
            
            DASHBOARD_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/"
            MSG="$MSG[View Grafana Dashboard]($DASHBOARD_URL)\n"
            MSG="$MSG[View GitHub Run](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})"

            # Build JSON payload safely using jq to avoid formatting and injection errors
            PAYLOAD=$(jq -n \
              --arg title "CI/CD Pipeline Performance: $BUILD_RESULT" \
              --arg desc "$MSG" \
              --argjson color "$COLOR" \
              '{embeds:[{title:$title,description:$desc,color:$color}]}')

            curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
          fi
